<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent pour ma Princesse 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #f39c12;
            --gold-light: #f1c40f;
            --gold-glow: #ffe066;
            --royal-purple: #1a0b2e;
            --deep-midnight: #0b0716;
            --pink-accent: #ff85a2;
            --card-border: rgba(241, 196, 15, 0.5);
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top center, #2d124d 0%, #1a0b2e 50%, #0b0716 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #ffb7c5, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 160px 120px, #ffe066, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.4;
            z-index: 0;
        }

        .floating-symbol {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
            animation: floatSlow 15s infinite ease-in-out;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        header {
            text-align: center;
            padding: 45px 20px 25px 20px;
            position: relative;
            z-index: 1;
        }

        .princess-crown {
            font-size: 2.8rem;
            display: inline-block;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.7));
            animation: pulseCrown 3s infinite ease-in-out;
        }

        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.6), 0 0 5px #fff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            h1 { font-size: 3rem; }
        }

        p.subtitle {
            font-size: 1.05rem;
            color: #e2e8f0;
            max-width: 650px;
            margin: 0 auto 18px auto;
            line-height: 1.6;
            font-weight: 300;
        }

        .kairi-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 133, 162, 0.15));
            border: 1px solid var(--gold-primary);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.92rem;
            color: #fce7f3;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #321654 0%, #1e0c33 100%);
            border: 2px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            user-select: none;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 14px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #d4af37, #fef1ac, #d4af37);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            z-index: 1;
        }

        .card::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 14px;
            transform: translateY(-50%);
            background: linear-gradient(180deg, #d4af37, #fef1ac, #d4af37);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
            z-index: 1;
        }

        .bow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
            opacity: 0.8;
            transition: transform 0.3s;
        }

        .card-number-wrapper {
            position: relative;
            z-index: 2;
            background: rgba(15, 7, 26, 0.85);
            border: 1px solid var(--gold-primary);
            border-radius: 50%;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.4);
            transition: all 0.3s;
        }

        .card-number {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 5px rgba(241, 196, 15, 0.8);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--gold-glow);
            box-shadow: 0 12px 30px rgba(241, 196, 15, 0.4), 0 0 15px rgba(255, 133, 162, 0.3);
        }

        .card:hover .card-number-wrapper {
            transform: scale(1.1);
            background: rgba(45, 18, 77, 0.95);
            border-color: #fff;
        }

        .card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(145deg, #150a21 0%, #0a0412 100%);
        }

        .card.locked::before, .card.locked::after {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .card.locked .card-number-wrapper {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        .card.locked:hover {
            transform: none;
            box-shadow: none;
        }

        .card.unlocked {
            border-color: #ff85a2;
        }

        .card.solved {
            border-color: #2ecc71;
            background: linear-gradient(145deg, #1b382b 0%, #0d241a 100%);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        .card.solved .card-number-wrapper {
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .card-status {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 0.85rem;
            z-index: 4;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 12, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: linear-gradient(145deg, #2a1047 0%, #130724 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 28px;
            padding: 35px 30px;
            max-width: 520px;
            width: 100%;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(243, 156, 18, 0.25);
            text-align: center;
            transform: scale(0.88);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 22px;
            background: none;
            border: none;
            color: #a78bfa;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-day-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }

        .riddle-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 22px;
            margin: 20px 0;
            border: 1px solid rgba(241, 196, 15, 0.3);
            border-left: 5px solid var(--gold-primary);
            text-align: left;
            line-height: 1.7;
            font-size: 1.02rem;
            color: #f3e8ff;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(241, 196, 15, 0.3);
            background: rgba(10, 4, 18, 0.6);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.3);
        }

        button.btn-submit {
            background: linear-gradient(135deg, var(--gold-primary), #d35400);
            border: none;
            color: white;
            padding: 14px 26px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.4);
        }

        button.btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .gift-revelation {
            margin-top: 25px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.15), rgba(46, 204, 113, 0.05));
            border: 1px solid #2ecc71;
            border-radius: 20px;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
        }

        .gift-revelation h3 {
            color: #2ecc71;
            margin-bottom: 12px;
            font-size: 1.25rem;
            font-family: 'Cinzel', serif;
        }

        .gift-emoji-display {
            font-size: 5rem;
            margin: 15px 0;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0
