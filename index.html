<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent pour ma Princesse 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #f39c12;
            --gold-light: #f1c40f;
            --gold-glow: #ffe066;
            --royal-purple: #1a0b2e;
            --deep-midnight: #0b0716;
            --pink-accent: #ff85a2;
            --card-border: rgba(241, 196, 15, 0.5);
            --text-light: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top center, #2d124d 0%, #1a0b2e 50%, #0b0716 100%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Étoiles animées en arrière-plan */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #ffb7c5, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 160px 120px, #ffe066, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.4;
            z-index: 0;
        }

        /* Symboles flottants (Livres, KH Wayfinders, Cœurs, Couronnes) */
        .floating-symbol {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
            animation: floatSlow 15s infinite ease-in-out;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        header {
            text-align: center;
            padding: 45px 20px 25px 20px;
            position: relative;
            z-index: 1;
        }

        .princess-crown {
            font-size: 2.8rem;
            display: inline-block;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.7));
            animation: pulseCrown 3s infinite ease-in-out;
        }

        @keyframes pulseCrown {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-light);
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.6), 0 0 5px #fff;
            margin-bottom: 12px;
            letter-spacing: 2px;
            line-height: 1.3;
        }

        @media (min-width: 768px) {
            h1 { font-size: 3rem; }
        }

        p.subtitle {
            font-size: 1.05rem;
            color: #e2e8f0;
            max-width: 650px;
            margin: 0 auto 18px auto;
            line-height: 1.6;
            font-weight: 300;
        }

        .kairi-badge {
            display: inline-flex;
            align-items: center;
            gap: 10
